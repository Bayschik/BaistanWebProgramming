<!DOCTYPE html>
<html lang="ru">
<head><meta charset="UTF-8"><title>Запись на курс</title></head>
<body>
  <h1>Запись на курс</h1>
  <form method="post">
    {% csrf_token %}

  </form>
</body>
</html>
